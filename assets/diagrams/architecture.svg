<text x="30" y="64" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c8cff">1 · DATA (FREE TIER)</text><text x="320" y="64" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c8cff">2 · INGESTION</text><text x="610" y="64" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c8cff">3 · STORE</text><text x="890" y="64" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c8cff">4 · SIGNAL</text><text x="1190" y="64" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c8cff">5 · DECIDE</text><text x="30" y="545" font-size="13" font-weight="700" letter-spacing="1.5" fill="#b061ff">6 · ORDERS &amp; EXECUTION</text><rect x="30" y="90" width="240" height="84" rx="10" fill="#1b2340" stroke="#6c8cff" stroke-width="1.6"/><text x="150.0" y="123.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Alpaca SIP bars</text><text x="150.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">consolidated, exact</text><text x="150.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">15 min behind</text><rect x="30" y="215" width="240" height="84" rx="10" fill="#1b2340" stroke="#6c8cff" stroke-width="1.6"/><text x="150.0" y="248.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Alpaca IEX bars</text><text x="150.0" y="268.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">real-time, free</text><rect x="30" y="340" width="240" height="84" rx="10" fill="#1b2340" stroke="#6c8cff" stroke-width="1.6"/><text x="150.0" y="373.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Finnhub / NewsAPI</text><text x="150.0" y="393.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">headlines</text><rect x="320" y="90" width="250" height="84" rx="10" fill="#1b2340" stroke="#6c8cff" stroke-width="1.6"/><text x="445.0" y="123.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Backfill + on-demand loader</text><text x="445.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">search a ticker, load only that one</text><rect x="320" y="215" width="250" height="84" rx="10" fill="#16302d" stroke="#26a69a" stroke-width="1.6"/><text x="445.0" y="248.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Live tail estimator</text><text x="445.0" y="268.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">IEX price, volume × k</text><text x="445.0" y="285.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">flagged “est.”, never stored</text><rect x="320" y="340" width="250" height="84" rx="10" fill="#16302d" stroke="#26a69a" stroke-width="1.6"/><text x="445.0" y="373.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">FinBERT sentiment</text><text x="445.0" y="393.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">scores each headline</text><rect x="610" y="90" width="230" height="210" rx="10" fill="#1b2340" stroke="#6c8cff" stroke-width="1.6"/><text x="725.0" y="186.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">SQLite</text><text x="725.0" y="206.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">bars · signals · trades</text><text x="725.0" y="223.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">ticker modes</text><text x="725.0" y="240.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">pending approvals</text><text x="725.0" y="257.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">system events</text><rect x="890" y="90" width="250" height="100" rx="10" fill="#16302d" stroke="#26a69a" stroke-width="1.6"/><text x="1015.0" y="131.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Triple confirmation + SMC</text><text x="1015.0" y="151.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">EMA 9/21 · RSI band · volume spike</text><text x="1015.0" y="168.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">order blocks · FVG · BOS</text><rect x="890" y="215" width="250" height="84" rx="10" fill="#16302d" stroke="#26a69a" stroke-width="1.6"/><text x="1015.0" y="248.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">ML win-probability</text><text x="1015.0" y="268.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">used only if it beats raw signals OOS</text><rect x="1190" y="90" width="380" height="100" rx="10" fill="#3a2d10" stroke="#f5b041" stroke-width="1.6"/><text x="1380.0" y="131.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Decision engine</text><text x="1380.0" y="151.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">risk gates · sizing · protective stop</text><text x="1380.0" y="168.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">no fresh signal → nothing happens</text><rect x="1190" y="215" width="380" height="84" rx="10" fill="#3a2d10" stroke="#f5b041" stroke-width="1.6"/><text x="1380.0" y="248.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Trade mode (per ticker, set on dashboard)</text><text x="1380.0" y="268.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">Off = skip   ·   Ask = you approve   ·   Auto = send</text><rect x="30" y="580" width="270" height="92" rx="10" fill="#3a2d10" stroke="#f5b041" stroke-width="1.6"/><text x="165.0" y="617.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Ask → pending approval</text><text x="165.0" y="637.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">you Approve / Reject</text><text x="165.0" y="654.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">expires in 10 min</text><rect x="330" y="580" width="230" height="92" rx="10" fill="#2c1d42" stroke="#b061ff" stroke-width="1.6"/><text x="445.0" y="617.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Auto → send now</text><text x="445.0" y="637.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">all risk gates still apply</text><rect x="590" y="580" width="300" height="92" rx="10" fill="#2c1d42" stroke="#b061ff" stroke-width="1.6"/><text x="740.0" y="617.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Pine exit manager</text><text x="740.0" y="637.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">RSI ≥ 70 / ≤ 30 or EMA trend flip</text><text x="740.0" y="654.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">runs for every mode, even Off</text><rect x="930" y="580" width="220" height="92" rx="10" fill="#2c1d42" stroke="#b061ff" stroke-width="1.6"/><text x="1040.0" y="617.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Broker interface</text><text x="1040.0" y="637.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">one API, two backends</text><rect x="1190" y="545" width="380" height="84" rx="10" fill="#2c1d42" stroke="#b061ff" stroke-width="1.6"/><text x="1380.0" y="578.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Alpaca paper (primary)</text><text x="1380.0" y="598.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">market entry + protective stop (OTO)</text><text x="1380.0" y="615.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">fills and exits are logged to SQLite</text><rect x="1190" y="645" width="380" height="64" rx="10" fill="#2c1d42" stroke="#b061ff" stroke-width="1.6"/><text x="1380.0" y="668.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">SimBroker</text><text x="1380.0" y="688.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">tests and dry runs</text><rect x="30" y="740" width="560" height="110" rx="10" fill="#2c1d42" stroke="#b061ff" stroke-width="1.6"/><text x="310.0" y="786.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Dashboard (Streamlit)</text><text x="310.0" y="806.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">TradingView-style chart: blue Long / red Short / purple Close fills</text><text x="310.0" y="823.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">PDH · PDL · PWH · PWL · Trade control panel · P&amp;L</text><rect x="630" y="740" width="940" height="110" rx="10" fill="#2c1d42" stroke="#b061ff" stroke-width="1.6"/><text x="1100.0" y="786.0" text-anchor="middle" font-size="16" font-weight="700" fill="#eef0ff">Scheduler  8:30 – 15:00 CT</text><text x="1100.0" y="806.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">bar-close cycle (exits first, then entries by mode) · approvals job every 10 s</text><text x="1100.0" y="823.0" text-anchor="middle" font-size="12.5" fill="#aab0cc">no entries in the last 15 min · flatten 5 min before close · reconcile with broker · Discord alerts</text>
