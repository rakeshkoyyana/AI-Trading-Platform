<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="f" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
<script>
/* Two-way bridge: shows the self-contained chart page in an inner frame and forwards what the chart posts
   ({alphawave: {...}}: confirm / reject / apply) to Streamlit as this component's value. Streamlit component protocol v1. */
(function () {
  const frame = document.getElementById("f");
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  let lastHtml = null, seq = 0, autoH = 0, baseH = 760;
  window.addEventListener("message", function (ev) {
    const d = ev.data;
    if (!d) return;
    if (ev.source === frame.contentWindow) {
      if (d.alphawave_height) { const h = Math.ceil(d.alphawave_height); if (h !== autoH) { autoH = h; send("streamlit:setFrameHeight", { height: h }); } return; }
      if (d.alphawave) {
        seq += 1;
        send("streamlit:setComponentValue", { value: Object.assign({ seq: Date.now() * 1000 + seq }, d.alphawave), dataType: "json" });
      }
      return;
    }
    if (d.type !== "streamlit:render") return;
    const a = d.args || {};
    if (a.html && a.html !== lastHtml) { lastHtml = a.html; frame.srcdoc = a.html; }
    baseH = a.height || 760;
    if (!a.autoheight) autoH = 0;
    send("streamlit:setFrameHeight", { height: (a.autoheight && autoH) || baseH });
    if (a.brand_link) {
      // the top-bar logo asks Python to open the About section (the page is closed until then)
      try {
        const P = window.parent;
        P.__awBrandSend = function () { seq += 1; send("streamlit:setComponentValue", { value: { seq: Date.now() * 1000 + seq, type: "toggle_about" }, dataType: "json" }); };
        if (!P.__awBrandBound) {
          P.__awBrandBound = true;
          P.document.addEventListener("click", function (e) {
            const t = e.target.closest && e.target.closest(".tp-brand");
            if (!t) return;
            e.preventDefault();
            if (P.__awBrandSend) P.__awBrandSend();
          }, true);
        }
      } catch (x) {}
    }
    if (a.scroll_token && a.scroll_token !== window.__awScroll) {
      window.__awScroll = a.scroll_token;
      setTimeout(function () { try { window.frameElement.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (x) {} }, 350);
    }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 760 });
})();
</script>
</body>
</html>
